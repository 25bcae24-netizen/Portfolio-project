name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # 3. Install backend dependencies
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      # 4. Run backend (test if no crash)
      - name: Run Backend Test
        run: |
          cd backend
          node server.js &
          sleep 5

      # 5. Done
      - name: CI Passed
        run: echo "Build successful 🚀"
